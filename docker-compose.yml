services:
  secure-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secure_api_lab
    ports:
      - "${SECURE_API_HOST_PORT:-8080}:8080"
    environment:
      # Swagger se habilita explícitamente solo para el entorno del laboratorio.
      EnableSwagger: "true"
      # Compose falla de forma segura si no se configuró la clave en .env.
      Jwt__SigningKey: "${JWT_SIGNING_KEY:?Defina JWT_SIGNING_KEY en el archivo .env}"
      # Solo para el contraste del laboratorio de carga (Plus):
      #   RATE_LIMITING_ENABLED=false docker compose up -d
      RateLimiting__Enabled: "${RATE_LIMITING_ENABLED:-true}"
    # Hardening del contenedor en runtime
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M

networks:
  default:
    driver: bridge
